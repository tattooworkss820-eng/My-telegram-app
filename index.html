<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Mini App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    button {
      padding: 14px 28px;
      font-size: 16px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2 id="greeting">Hello!</h2>
  <button id="closeBtn">Close App</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Make it full screen inside Telegram

    // Get the user's name if opened in Telegram
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('greeting').innerText = `Welcome, ${tg.initDataUnsafe.user.first_name}!`;
    }

    // Close button action
    document.getElementById('closeBtn').addEventListener('click', () => {
      tg.close();
    });
  </script>
</body>
</html>
