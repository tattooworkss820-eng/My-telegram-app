<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Feed</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--tg-theme-secondary-bg-color, #f0f2f5);
      color: var(--tg-theme-text-color, #050505);
      padding-bottom: 20px;
    }

    /* Top Navigation Header */
    .header {
      background-color: var(--tg-theme-bg-color, #ffffff);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      color: var(--tg-theme-button-color, #1877f2);
      font-size: 22px;
      font-weight: bold;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--tg-theme-button-color, #1877f2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
    }

    /* Create Post Box */
    .create-post {
      background: var(--tg-theme-bg-color, #ffffff);
      margin: 10px 0;
      padding: 12px 16px;
      border-radius: 8px;
    }

    .create-post-top {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .create-post input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background-color: var(--tg-theme-secondary-bg-color, #f0f2f5);
      color: var(--tg-theme-text-color, #000);
      outline: none;
      font-size: 14px;
    }

    .post-btn {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background-color: var(--tg-theme-button-color, #1877f2);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-weight: bold;
      cursor: pointer;
    }

    /* Feed Posts */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .post-card {
      background: var(--tg-theme-bg-color, #ffffff);
      padding: 14px;
      border-radius: 8px;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .post-author {
      font-weight: bold;
      font-size: 14px;
    }

    .post-time {
      font-size: 12px;
      color: var(--tg-theme-hint-color, #65676b);
    }

    .post-content {
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .post-actions {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      padding-top: 8px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--tg-theme-hint-color, #65676b);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 4px;
    }

    .action-btn.liked {
      color: var(--tg-theme-button-color, #1877f2);
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="header">
    <h1>facebook</h1>
    <div class="user-profile">
      <div class="avatar" id="userAvatar">U</div>
      <span id="userName">User</span>
    </div>
  </div>

  <!-- Create Post Area -->
  <div class="create-post">
    <div class="create-post-top">
      <input type="text" id="postInput" placeholder="What's on your mind?">
    </div>
    <button class="post-btn" id="submitPost">Post</button>
  </div>

  <!-- Feed Section -->
  <div class="feed" id="feedContainer">
    <!-- Default Post -->
    <div class="post-card">
      <div class="post-header">
        <div class="avatar">V</div>
        <div>
          <div class="post-author">VIBE:INK Official</div>
          <div class="post-time">2 hrs ago</div>
        </div>
      </div>
      <div class="post-content">
        Welcome to the new Mini Facebook on Telegram! You can create posts, share updates, and interact directly inside Telegram.
      </div>
      <div class="post-actions">
        <button class="action-btn" onclick="toggleLike(this)">👍 Like (<span class="like-count">12</span>)</button>
        <button class="action-btn" onclick="commentPost()">💬 Comment</button>
        <button class="action-btn" onclick="sharePost()">↗️ Share</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Make app full height

    // Populate Telegram User Info
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const user = tg.initDataUnsafe.user;
      const firstName = user.first_name || "User";
      document.getElementById('userName').innerText = firstName;
      document.getElementById('userAvatar').innerText = firstName.charAt(0).toUpperCase();
    }

    // Publish New Post
    document.getElementById('submitPost').addEventListener('click', () => {
      const input = document.getElementById('postInput');
      const text = input.value.trim();

      if (!text) {
        tg.showAlert("Please write something before posting!");
        return;
      }

      const userName = document.getElementById('userName').innerText;
      const initial = userName.charAt(0).toUpperCase();

      const newPost = document.createElement('div');
      newPost.className = 'post-card';
      newPost.innerHTML = `
        <div class="post-header">
          <div class="avatar">${initial}</div>
          <div>
            <div class="post-author">${userName}</div>
            <div class="post-time">Just now</div>
          </div>
        </div>
        <div class="post-content">${text}</div>
        <div class="post-actions">
          <button class="action-btn" onclick="toggleLike(this)">👍 Like (<span class="like-count">0</span>)</button>
          <button class="action-btn" onclick="commentPost()">💬 Comment</button>
          <button class="action-btn" onclick="sharePost()">↗️ Share</button>
        </div>
      `;

      const feed = document.getElementById('feedContainer');
      feed.insertBefore(newPost, feed.firstChild);
      input.value = '';

      // Subtle haptic vibration on phone
      if (tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
    });

    // Like Toggle
    function toggleLike(btn) {
      const countSpan = btn.querySelector('.like-count');
      let count = parseInt(countSpan.innerText);

      if (btn.classList.contains('liked')) {
        btn.classList.remove('liked');
        countSpan.innerText = count - 1;
      } else {
        btn.classList.add('liked');
        countSpan.innerText = count + 1;
        if (tg.HapticFeedback) {
          tg.HapticFeedback.impactOccurred('light');
        }
      }
    }

    // Comment Alert
    function commentPost() {
      tg.showAlert("Comment section opened!");
    }

    // Share Action
    function sharePost() {
      tg.showAlert("Post link copied to share on Telegram!");
    }
  </script>
</body>
</html>
